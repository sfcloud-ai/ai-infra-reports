name: Merge validated report
on:
  workflow_run:
    workflows: ['Validate reports']
    types: [completed]
permissions: {}
concurrency:
  group: report-merge-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: false
jobs:
  merge:
    if: vars.REPORT_AUTOMERGE_ENABLED == 'true' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Only trusted default-branch code and its pinned dependencies are executed.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.2'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        id: merger
        with:
          app-id: ${{ vars.REPORT_MERGER_APP_ID }}
          private-key: ${{ secrets.REPORT_MERGER_PRIVATE_KEY }}
          owner: sfcloud-ai
          repositories: ai-infra-reports
          permission-contents: write
          permission-pull-requests: write
          permission-actions: read
          permission-checks: read
      - run: node scripts/merge-report.mjs
        env:
          REPORT_MERGER_TOKEN: ${{ steps.merger.outputs.token }}
          REPORT_PRODUCER_APP_ID: ${{ vars.REPORT_PRODUCER_APP_ID }}
          REPORT_MERGER_APP_ID: ${{ vars.REPORT_MERGER_APP_ID }}
          REPORT_AUTOMERGE_ENABLED: ${{ vars.REPORT_AUTOMERGE_ENABLED }}
          REPORT_BOT_ID: ${{ vars.REPORT_BOT_ID }}
          REPORT_BOT_LOGIN: ${{ vars.REPORT_BOT_LOGIN }}
